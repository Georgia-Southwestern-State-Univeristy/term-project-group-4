name: CD Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EB
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run eslint

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Package deployment bundle
        run: |
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "docs/*" \
            -x "logs/*" \
            -x "*.log"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        env:
          S3_BUCKET: ${{ secrets.EB_DEPLOY_BUCKET }}
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
        run: |
          VERSION_LABEL="${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          echo "VERSION_LABEL=$VERSION_LABEL" >> $GITHUB_ENV
          aws s3 cp deploy.zip "s3://${S3_BUCKET}/${APP_NAME}/${VERSION_LABEL}.zip"

      - name: Create EB application version
        env:
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
          S3_BUCKET: ${{ secrets.EB_DEPLOY_BUCKET }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$APP_NAME/$VERSION_LABEL.zip"

      - name: Deploy EB environment
        env:
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
          ENV_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$APP_NAME" \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"
