name: CD Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EB
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run eslint

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Validate deployment target
        env:
          ENV_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          if [ -z "$ENV_NAME" ]; then
            echo "EB_ENVIRONMENT_NAME must be set"
            exit 1
          fi

      - name: Package deployment bundle
        run: |
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "logs/*" \
            -x "*.log"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        env:
          S3_BUCKET: ${{ secrets.EB_DEPLOY_BUCKET }}
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
        run: |
          VERSION_LABEL="${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          echo "VERSION_LABEL=$VERSION_LABEL" >> $GITHUB_ENV
          aws s3 cp deploy.zip "s3://${S3_BUCKET}/${APP_NAME}/${VERSION_LABEL}.zip"

      - name: Create EB application version
        env:
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
          S3_BUCKET: ${{ secrets.EB_DEPLOY_BUCKET }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$APP_NAME/$VERSION_LABEL.zip"

      - name: Deploy EB environment
        env:
          APP_NAME: ${{ secrets.EB_APPLICATION_NAME }}
          ENV_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$APP_NAME" \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for EB environment to finish updating
        env:
          ENV_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$ENV_NAME"

      - name: Verify EB health and smoke test /health
        env:
          ENV_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          ENV_JSON=$(aws elasticbeanstalk describe-environments \
            --environment-names "$ENV_NAME" \
            --query 'Environments[0].{CNAME:CNAME,Status:Status,Health:Health,HealthStatus:HealthStatus}' \
            --output json)

          echo "$ENV_JSON"

          STATUS=$(echo "$ENV_JSON" | jq -r '.Status')
          HEALTH=$(echo "$ENV_JSON" | jq -r '.Health')
          HEALTH_STATUS=$(echo "$ENV_JSON" | jq -r '.HealthStatus')
          CNAME=$(echo "$ENV_JSON" | jq -r '.CNAME')

          if [ "$STATUS" != "Ready" ]; then
            echo "Environment status is not Ready: $STATUS"
            exit 1
          fi

          if [ "$HEALTH" = "Red" ] || [ "$HEALTH_STATUS" = "Severe" ]; then
            echo "Environment health is not acceptable: Health=$HEALTH HealthStatus=$HEALTH_STATUS"
            exit 1
          fi

          if [ -z "$CNAME" ] || [ "$CNAME" = "null" ]; then
            echo "Failed to resolve environment CNAME"
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            echo "Smoke test attempt $attempt: https://$CNAME/health"
            if curl --fail --silent --show-error "https://$CNAME/health"; then
              exit 0
            fi
            sleep 10
          done

          echo "Smoke test failed for https://$CNAME/health"
          exit 1