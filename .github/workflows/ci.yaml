name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect docs-only change set
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs_only:
              - 'docs/**'
              - '**/*.md'
              - '!**/*.js'
              - '!**/*.mjs'
              - '!**/*.cjs'
              - '!**/*.ts'
              - '!**/*.tsx'
              - '!**/*.jsx'
              - '!package.json'
              - '!package-lock.json'
              - '!pnpm-lock.yaml'
              - '!yarn.lock'
              - '!vite.config.*'
              - '!vitest.config.*'
              - '!eslint.config.*'
              - '!server.js'
              - '!src/**'
              - '!.github/workflows/**'

  lint:
    name: Code Linting
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip lint for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only PR detected. Skipping lint run."

      - name: Checkout code
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Run ESLint
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run eslint

  test:
    name: Unit Tests
    needs: [changes, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Skip tests for docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only PR detected. Skipping unit tests."

      - name: Checkout code
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Run Tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test