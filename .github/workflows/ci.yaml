name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'server/**'
              - 'server.js'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.jsx'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'eslint.config.*'
              - 'playwright.config.*'
              - '.github/workflows/**'
              - 'migrations/**'
              - 'seeds/**'

  lint:
    name: Code Linting
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip lint for docs-only PR
        if: needs.changes.outputs.code_changed == 'false'
        run: echo "No code changes detected. Skipping lint run."

      - name: Checkout code
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - name: Run ESLint
        if: needs.changes.outputs.code_changed == 'true'
        run: npm run eslint

  test:
    name: Unit Tests
    needs: [changes, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Skip tests for docs-only PR
        if: needs.changes.outputs.code_changed == 'false'
        run: echo "No code changes detected. Skipping unit tests."

      - name: Checkout code
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - name: Run Unit Tests
        if: needs.changes.outputs.code_changed == 'true'
        run: npm run test

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [changes, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E for docs-only PR
        if: needs.changes.outputs.code_changed == 'false'
        run: echo "No code changes detected. Skipping E2E tests."

      - name: Checkout code
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.code_changed == 'true'
        run: npx playwright install --with-deps

      - name: Build application
        if: needs.changes.outputs.code_changed == 'true'
        run: npm run build

      - name: Create .env file for tests
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          cat > .env << EOF
          NODE_ENV=test
          CI=true
          FRONTEND_URL=http://localhost:5173
          BASE_URL=http://localhost:5173
          SESSION_SECRET=test-session-secret
          TEST_USER_ID=demo-user-123
          EOF

      - name: Run E2E Tests
        if: needs.changes.outputs.code_changed == 'true'
        env:
          NODE_ENV: test
          CI: true
          FRONTEND_URL: http://localhost:5173
          BASE_URL: http://localhost:5173
          SESSION_SECRET: test-session-secret
          TEST_USER_ID: demo-user-123
        run: npm run test:e2e

      - name: Upload test results
        if: always() && needs.changes.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7